<h1>GitHub Issues</h1>
<div class="my-5 border-b-2 border-blue-600">
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <!-- Botones para controlar el Estado -->
        <div class="flex flex-col col-span-3">
            <div class="flex gap-2">
                <button class="btn">All</button>
                <button class="btn">Open</button>
                <button class="btn">Closed</button>
            </div>
        </div>
        <!-- Listado -->
         <div class="mt-4 flex flex-col col-span-2">
            <h3>Issues:</h3>
            <a routerLink="/issue/123">Ir a issue 123</a>
            <!-- Listado de Issues -->

             <!-- TODO:Spinner -->

             <!-- Todo: Si no hay issues por el filtro -->
         </div>
         <!-- Labels -->
          <div>
            <h2>Labels</h2>
            @if(labelsQuery.isLoading()){
                <p>Estamos cargando</p>
            }@else {
                <issues-label-selector [labels]="labelsQuery.data()?? []"></issues-label-selector>
            }
            <!-- TODO: Spinner -->
             <!-- TODO: Label selector -->
          </div>
    </section>
</div>
